<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>NuclearRad | Sensor Readings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
    <style>
      html, body { margin: 0; background: #ffffff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runs the Streamlit app fully in the browser (Pyodide), so it can be served as a static site on Vercel. -->
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
      mount(
        {
          requirements: ["numpy", "pandas", "plotly"],
          entrypoint: "sensor_charts.py",
          files: {
            "sensor_charts.py": { url: "./sensor_charts.py" },
            "charts.py": { url: "./charts.py" },
            "nuclearrad.py": { url: "./nuclearrad.py" },
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
